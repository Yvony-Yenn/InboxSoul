[project]
name = "inboxsoul"
version = "0.1.0"
description = "Stateful multi-agent email triage system with feedback-driven self-improvement."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "ollama>=0.3",
    "msal>=1.28",
    "beautifulsoup4>=4.12",
    "aioimaplib>=2.0",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
